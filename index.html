<script>
const mappenRegeln = {
    "Mathe": "Blauer Ordner",
    "Deutsch": "Roter Schnellhefter",
    "Englisch": "Gelbe Mappe",
    "Chemie": "Hellblaue Mappe",
    "Religion": "Lila Mappe",
    "Geschichte": "Oranger Ordner",
    "Niederländisch": "Pinke Mappe",
    "Biologie": "Grüne Mappe",
    "Erdkunde": "Braune Mappe",
    "Sport": "Keine Mappe",
    "Schwimmen": "Keine Mappe",
    "Kunst": "Keine Mappe",
    "Projekt": "Keine Mappe"
};

const demoStundenplan = {
    "Montag": [
        { fach: "Deutsch", lehrer: "Hr. Müller", status: "normal" },
        { fach: "Mathe", lehrer: "Fr. Schmidt", status: "ausfall" },
        { fach: "Englisch", lehrer: "Mrs. Smith", status: "normal" }
    ],
    "Dienstag": [
        { fach: "Chemie", lehrer: "Hr. Boyle", status: "normal" },
        { fach: "Sport", lehrer: "Hr. Fit", status: "normal" }
    ],
    "Mittwoch": [
        { fach: "Religion", lehrer: "Fr. Fromm", status: "normal" },
        { fach: "Geschichte", lehrer: "Hr. Alt", status: "vertretung", vertretungsLehrer: "Fr. Neu" }
    ],
    "Donnerstag": [
        { fach: "Niederländisch", lehrer: "Mevr. de Jong", status: "normal" },
        { fach: "Kunst", lehrer: "Fr. Pinsel", status: "normal" }
    ],
    "Freitag": [
        { fach: "Biologie", lehrer: "Fr. Bio", status: "normal" },
        { fach: "Schwimmen", lehrer: "Hr. Platsch", status: "normal" },
        { fach: "Projekt", lehrer: "Hr. Team", status: "normal" }
    ]
};

let aktuellerModus = "demo";
let gespeicherterPlan = null;
let wochentage = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag"];
let aktuellerTagIndex = 0;
</script>
<script>
window.onload = function() {
    erstelleManuelleEingabefelder();
    ermittleNaechstenSchultag();
};

function changeTheme(themeName) {
    document.documentElement.setAttribute('data-theme', themeName);
}

function playPackSound() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc1 = audioCtx.createOscillator();
        let gain1 = audioCtx.createGain();
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(120, audioCtx.currentTime);
        osc1.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
        gain1.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain1.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start();
        osc1.stop(audioCtx.currentTime + 0.08);

        setTimeout(() => {
            let osc2 = audioCtx.createOscillator();
            let gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc2.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.05);
            gain2.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain2.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start();
            osc2.stop(audioCtx.currentTime + 0.05);
        }, 40);
    } catch(e) {
        console.log("Audio blockiert.");
    }
}

function toggleItem(checkbox) {
    const li = checkbox.closest('li');
    if (checkbox.checked) {
        li.classList.add('eingepackt');
        playPackSound();
    } else {
        li.classList.remove('eingepackt');
    }
}

function anmelden() {
    const status = document.getElementById("loginStatus");
    status.innerHTML = "<span class='erfolg'>Anmeldung erfolgreich...</span>";
    setTimeout(() => {
        aktuellerModus = "demo";
        document.getElementById("appStatus").innerText = "🟢 Stundenplan geladen (Demo)";
        document.getElementById("loginBereich").style.display = "none";
        document.getElementById("appBereich").style.display = "block";
        zeigeStundenplan();
    }, 800);
}

function manuellStarten() {
    document.getElementById("loginBereich").style.display = "none";
    document.getElementById("manuellBereich").style.display = "block";
}

function zurueckZumLogin() {
    document.getElementById("manuellBereich").style.display = "none";
    document.getElementById("loginBereich").style.display = "block";
}

function abmelden() {
    document.getElementById("appBereich").style.display = "none";
    document.getElementById("loginBereich").style.display = "block";
    document.getElementById("loginStatus").innerText = "";
}

function erstelleManuelleEingabefelder() {
    const container = document.getElementById("manuellTage");
    container.innerHTML = "";
    wochentage.forEach(tag => {
        const div = document.createElement("div");
        div.className = "manuell-tag";
        div.innerHTML = `
            <h2>${tag}</h2>
            <select class="stunden-select" onchange="erstelleFaecherInputs('${tag}', this.value)">
                <option value="0">0 Stunden</option>
                <option value="4">4 Stunden</option>
                <option value="6" selected>6 Stunden</option>
                <option value="8">8 Stunden</option>
            </select>
            <div id="inputs-${tag}" class="fach-eingabe"></div>
        `;
        container.appendChild(div);
        erstelleFaecherInputs(tag, 6);
    });
}

function erstelleFaecherInputs(tag, anzahl) {
    const container = document.getElementById(`inputs-${tag}`);
    container.innerHTML = "";
    for(let i = 1; i <= anzahl; i++) {
        container.innerHTML += `<input type="text" style="margin-top:5px;" placeholder="${i}. Stunde - Fach" id="input-${tag}-${i}">`;
    }
}

function manuellSpeichern() {
    gespeicherterPlan = {};
    wochentage.forEach(tag => {
        gespeicherterPlan[tag] = [];
        const inputs = document.querySelectorAll(`[id^="input-${tag}-"]`);
        inputs.forEach((input) => {
            if(input.value.trim() !== "") {
                gespeicherterPlan[tag].push({ fach: input.value.trim(), lehrer: "Manuell", status: "normal" });
            }
        });
    });
    aktuellerModus = "manuell";
    document.getElementById("appStatus").innerText = "🔵 Manueller Stundenplan";
    document.getElementById("manuellBereich").style.display = "none";
    document.getElementById("appBereich").style.display = "block";
    zeigeStundenplan();
}

function ermittleNaechstenSchultag() {
    let heute = new Date();
    let tagNummer = heute.getDay();
    if (tagNummer === 0 || tagNummer === 6) {
        aktuellerTagIndex = 0;
    } else {
        aktuellerTagIndex = tagNummer - 1;
    }
}

function vorherigerTag() {
    aktuellerTagIndex--;
    if (aktuellerTagIndex < 0) aktuellerTagIndex = 4;
    zeigeStundenplan();
}

function naechsterTag() {
    aktuellerTagIndex++;
    if (aktuellerTagIndex > 4) aktuellerTagIndex = 0;
    zeigeStundenplan();
}

function zeigeStundenplan() {
    const tag = wochentage[aktuellerTagIndex];
    const vorherigerTagIndex = aktuellerTagIndex === 0 ? 4 : aktuellerTagIndex - 1;
    const gesternTag = wochentage[vorherigerTagIndex];

    document.getElementById("tagAnzeige").innerText = `Für ${tag}`;
    document.getElementById("hinweisText").innerText = `🎒 Das musst du für ${tag} einpacken:`;
    document.getElementById("datumAnzeige").innerText = "Schultag-Ansicht";

    const plan = aktuellerModus === "demo" ? demoStundenplan : gespeicherterPlan;
    const facherHeute = plan[gesternTag] || [];
    const facherMorgen = plan[tag] || [];

    const mussMitListe = document.getElementById("mussMitListe");
    const vertretungsListe = document.getElementById("vertretungsListe");
    const ausfallListe = document.getElementById("ausfallListe");
    const sportBox = document.getElementById("sportSpezialBox");

    mussMitListe.innerHTML = "";
    vertretungsListe.innerHTML = "";
    ausfallListe.innerHTML = "";
    sportBox.innerHTML = "";

    let brauchtSportzeug = false;
    let brauchtSchwimmzeug = false;

    const aktiveHeute = new Set(facherHeute.filter(f => f.status !== "ausfall").map(f => f.fach));
    const aktiveMorgen = new Set(facherMorgen.filter(f => f.status !== "ausfall").map(f => f.fach));

    facherMorgen.forEach(stunde => {
        const mappe = mappenRegeln[stunde.fach] || "Keine Mappe";
        const li = document.createElement("li");

        if (stunde.fach.toLowerCase() === "sport" && stunde.status !== "ausfall") brauchtSportzeug = true;
        if (stunde.fach.toLowerCase() === "schwimmen" && stunde.status !== "ausfall") brauchtSchwimmzeug = true;

        if (stunde.status === "ausfall") {
            li.className = "ausfall-eintrag";
            li.innerHTML = `<div class="li-content"><div class="fach">📚 ${stunde.fach}</div><div class="lehrer">${stunde.lehrer}</div><span class="ausfall-label">❌ Fällt aus – keine Mappe nötig!</span></div>`;
            ausfallListe.appendChild(li);
            return; 
        }

        if (stunde.status === "vertretung") {
            li.className = "vertretung-eintrag";
            li.innerHTML = `<div class="li-content"><span class="vertretung-label">VERTRETUNG</span><div class="fach">🟢 ${stunde.fach}</div><div class="lehrer">Vertretung durch ${stunde.vertretungsLehrer || 'Lehrkraft'}</div></div>`;
            vertretungsListe.appendChild(li);
        }

        const checkboxHTML = `<input type="checkbox" class="pack-check" onchange="toggleItem(this)">`;

        if (!aktiveHeute.has(stunde.fach)) {
            li.innerHTML = `${checkboxHTML}<div class="li-content"><div class="fach">📥 ${stunde.fach}</div><div class="lehrer">${stunde.lehrer}</div><small style="color: var(--green-color); font-weight: bold;">Muss rein: ${mappe}</small></div>`;
            mussMitListe.appendChild(li);
        } else {
            li.innerHTML = `${checkboxHTML}<div class="li-content"><div class="fach">🔄 ${stunde.fach}</div><div class="lehrer">${stunde.lehrer}</div><small style="color: var(--text-muted);">Bleibt drin: ${mappe}</small></div>`;
            mussMitListe.appendChild(li);
        }
    });

    if (brauchtSportzeug) {
        sportBox.innerHTML = `<div class="sport-warnbox">👟 <b>Sporttasche einpacken!</b><br>Denk an Sportkleidung, Hallenschuhe und Deo.</div>`;
    }
    if (brauchtSchwimmzeug) {
        sportBox.innerHTML = `<div class="sport-warnbox">🩱 <b>Schwimmtasche einpacken!</b><br>Denk an Badebekleidung, Handtuch und Duschgel.</div>`;
    }

    facherHeute.forEach(stunde => {
        if (stunde.status !== "ausfall" && !aktiveMorgen.has(stunde.fach)) {
            const mappe = mappenRegeln[stunde.fach] || "Keine Mappe";
            const li = document.createElement("li");
            li.style.borderLeft = "4px solid var(--red-color)";
            li.innerHTML = `<input type="checkbox" class="pack-check" onchange="toggleItem(this)"><div class="li-content"><div class="fach" style="color: var(--red-color);">📤 ${stunde.fach}</div><small style="color: var(--text-muted);">Muss raus aus dem Rucksack! (${mappe})</small></div>`;
            mussMitListe.appendChild(li);
        }
    });

    if (mussMitListe.children.length === 0) mussMitListe.innerHTML = '<li class="leer">Keine Fächer zu packen!</li>';
    if (vertretungsListe.children.length === 0) vertretungsListe.innerHTML = '<li class="leer">Keine Vertretungen</li>';
    if (ausfallListe.children.length === 0) ausfallListe.innerHTML = '<li class="leer">Kein Unterrichtsausfall</li>';
}
</script>
</body>
</html>
